  </div>
  <div class="person">
    <input type="checkbox" class="removePersonCheckbox" id="person2">
    <label for="person2">Jane Smith</label>
  </div>
  <!-- Add more people as needed -->
</div>
<div id="personList">
  <!-- Dynamically generated list of people will go here -->
</div>
<!-- Button to remove selected people -->
<button id="removeSelectedBtn">Remove Selected People</button>

   <div id="schedule"></div>
